# CPU (default):  docker compose up
# GPU (CUDA):     docker compose --profile gpu up
# Demo cameras:   docker compose --profile cpu --profile demo-cams up   (or --profile gpu --profile demo-cams)
#                 DEFAULT_STREAMS="$(cat demo-videos/demo-cams.json)" seeds them into an empty stream list.
# The committed .env sets COMPOSE_PROFILES=cpu; an explicit --profile flag replaces it,
# so exactly one backend (CPU or GPU) runs and answers at host "backend".
name: emotion-recognition

services:
  frontend:
    build:
      context: ./frontend
    image: emotion-recognition/frontend:local
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped

  backend:
    profiles: ["cpu"]
    build:
      context: ./backend
      args:
        VARIANT: cpu
    image: emotion-recognition/backend:cpu
    environment:
      DEFAULT_STREAMS: ${DEFAULT_STREAMS:-}
    volumes:
      - data:/data
    networks:
      default:
        aliases: [backend]
    restart: unless-stopped

  backend-gpu:
    profiles: ["gpu"]
    build:
      context: ./backend
      args:
        VARIANT: gpu
    image: emotion-recognition/backend:gpu
    environment:
      DEFAULT_STREAMS: ${DEFAULT_STREAMS:-}
    gpus: all
    volumes:
      - data:/data
    networks:
      default:
        aliases: [backend]
    restart: unless-stopped

  # --- demo-cams: MediaMTX plus a camera emulator looping the 20 prepared clips (story 1.8; synthetic fallback) ---
  mediamtx:
    profiles: ["demo-cams"]
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    restart: unless-stopped

  camera-emulator:
    profiles: ["demo-cams"]
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    entrypoint: ["/bin/sh", "/demo/demo-cams.sh"]
    volumes:
      - ./demo-videos:/demo:ro,z
      - ./backend/bench/data:/src:ro,z
    depends_on: [mediamtx]
    restart: unless-stopped

volumes:
  data:
