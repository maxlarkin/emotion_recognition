- id: '1'
  title: Repository skeleton and Docker compose with CPU and GPU profiles
  description: Create backend/frontend/docs layout, FastAPI app with /api/health, React+Vite shell served by nginx, and docker compose with default CPU profile and gpu profile, model weights baked at build (CAP-5 base, stack.md Runtime).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: Verify `docker compose up` and `docker compose --profile gpu up` both start and /api/health reports device. Download all model weights (YuNet, EmotiEffLib enet_b0_8_va_mtl, Silero VAD, GigaAM emo) in the backend Dockerfile so runtime needs no network.
- id: '2'
  title: Inference core with per-stage benchmark
  description: Implement detector, IoU tracker, FER, VAD, SER, smoothing and late fusion as one worker process that serves several sources (per-source slots, faces batched across sources), with unit tests and a bench command reporting per-stage ms and peak VRAM/RAM (stack.md Models, Processing, Runtime; CAP-6 first half).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: First confirm GigaAM-Emo label list via get_probs and record it; map labels per SPEC Assumptions. Stop and report if all models do not fit 4 GB VRAM together or if FER+detector exceed 100 ms per frame on GPU profile.
